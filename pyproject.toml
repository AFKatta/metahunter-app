[project]
name = "mtgo-meta"
version = "0.1.0"
description = "Local MTGO match-log scraper and personal meta dashboard"
requires-python = ">=3.11"
dependencies = [
    # Our own TLS trust roots. Windows fills its root store lazily, so
    # Python can fail to verify a perfectly valid certificate there;
    # see mtgo_meta/net.py. Not optional — sign-in depends on it.
    "certifi>=2024.2.2",
    "pydantic>=2.6",
    "watchdog>=4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",       # FastAPI TestClient
    "pyinstaller>=6.0",  # builds the distributable .exe
]
# Pulled in once we start the API/UI/watcher pieces:
# api = ["fastapi", "uvicorn[standard]"]
# watcher = ["watchdog"]
# scryfall = ["httpx"]
# db = ["sqlalchemy", "alembic"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtgo_meta"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
