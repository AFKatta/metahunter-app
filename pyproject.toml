[project]
name = "mtgo-meta"
version = "0.0.1"
description = "Local MTGO match-log scraper and personal meta dashboard"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "watchdog>=4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# Pulled in once we start the API/UI/watcher pieces:
# api = ["fastapi", "uvicorn[standard]"]
# watcher = ["watchdog"]
# scryfall = ["httpx"]
# db = ["sqlalchemy", "alembic"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtgo_meta"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
