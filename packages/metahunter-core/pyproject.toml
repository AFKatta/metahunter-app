[project]
name = "metahunter-core"
version = "0.1.0"
description = "Shared classifier + log parser for Metahunter (desktop client + ingest server)"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
# Used by the corpus builder script (scrapes mtgo.com decklists).
# Not needed at runtime by either the desktop client or the server.
sources = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metahunter_core"]
